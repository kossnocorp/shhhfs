[package]
name = "shhhfs"
version = "0.1.0"
edition = "2024"
description = "Virtual file system for secrets on Linux and macOS"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/shhhfs"

[[bin]]
name = "shhhfs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
dialoguer = "0.12.0"
fuser = "0.17.0"
indicatif = "0.18.4"
libc = "0.2.186"
serde_json = "1.0.145"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }

[dev-dependencies]
insta = { version = "1.47.2", features = ["ron"] }
